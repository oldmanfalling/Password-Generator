<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
@import url('https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap');
</style>
    <title>Password Generator</title>

</head>
<body>

    <div class="container">

        <div class="generator-wrapper">
            <p class="title">Generate a <br><em>random password</em></p>
            <p class="supporting-text">Never use an insecure password again</p>
                <div class="password-wrapper">
                    <div class="characters">Number of characters required: <input id="characterNumber" type="number" ></div>
                    <button class="button" id="generateButton" type="button">Generate Passwords</button>
                </div>
            <hr>
            <div class="result-wrapper">
                <div id="resultOne"></div>
                <div id="resultTwo"></div>
             </div>

        </div>

    </div>

    <script src="index.js"></script>
    
</body>
</html>
